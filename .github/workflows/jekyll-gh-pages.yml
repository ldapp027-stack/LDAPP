# Deploys the prebuilt store (web/store) to GitHub Pages as plain static files.
#
# Note: the Expo build uses absolute paths ("/_expo/...", "/assets/..."), so the
# site only works when served from the domain root — i.e. with a custom domain
# set in Settings → Pages (e.g. ldstore.com). Under the default
# https://<user>.github.io/ldapp/ sub-path the pages will load without JS/CSS.
name: Deploy store to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "web/store/**"
      - ".github/workflows/jekyll-gh-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp -R web/store/. _site/
          # Skip Jekyll so the "_expo" folder is not dropped
          touch _site/.nojekyll
          # SPA fallback for dynamic routes such as /product/123
          cp _site/index.html _site/404.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
